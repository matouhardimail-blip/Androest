name: agentphone
description: "AgentPhone — منصة وكلاء ذكاء اصطناعي متعددة."
publish_to: "none"
version: 1.0.0+8

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  llama_flutter_android: ^0.2.6
  dio: ^5.11.1
  path_provider: ^2.1.5
  path: ^1.9.0
  http: ^1.2.0
  flutter_markdown: ^0.7.3
  file_selector: ^1.0.3
  package_info_plus: ^8.0.0
  permission_handler: ^11.3.1
  open_filex: ^4.4.0
  shared_preferences: ^2.2.3
  uuid: ^4.3.3
  flutter_local_notifications: ^17.2.2
  html: ^0.15.4
  intl: ^0.19.0
  syncfusion_flutter_pdf: ^26.2.14
  image_picker: ^1.1.2
  archive: ^3.6.1
  share_plus: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/

# إعدادات الأيقونة
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#080B18"
  adaptive_icon_foreground: "assets/icon.png"

# إعدادات شاشة البداية
flutter_native_splash:
  color: "#080B18"
  image: assets/splash.png
  android_12:
    color: "#080B18"
    image: assets/splash.png