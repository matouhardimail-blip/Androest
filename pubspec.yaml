name: agentphone
description: "AgentPhone — مساعد ذكاء اصطناعي يعمل بالكامل على جهاز Samsung Galaxy A52 دون اتصال بالإنترنت."
publish_to: "none"
version: 1.0.0+2

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  llama_flutter_android: ^0.2.6
  dio: ^5.11.1
  path_provider: ^2.1.6
  path: ^1.9.1
  http: ^1.2.0
  flutter_markdown: ^0.7.3
  file_picker: ^8.1.2
  package_info_plus: ^8.0.0
  permission_handler: ^11.3.1
  open_filex: ^4.4.0
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true